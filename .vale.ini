# The one Vale config, for this machine and for CI.
#
# `mise run lint-prose` (what fails the build) and `mise run lint-advice` (the
# full run) read this same file and differ by `--filter`, not by environment.
# There is no second ini.
#
# Every style is vendored under styles/ and tracked, so there is no
# `Packages =` line. Adding one back re-syncs the styles over the top and
# recreates the styles/.vale-config/ fragments this file replaced.

StylesPath = styles

MinAlertLevel = suggestion

Vocab = Blog

[*.md]
BasedOnStyles = Vale, Microsoft, proselint, Slop, Security, House

# First person and contractions are both the voice of this blog. The two
# Microsoft rules that flag them contradict it, so they stay off.
Microsoft.FirstPerson = NO
Microsoft.Contractions = NO

# House.EmDash allows none at all, so Slop.EmDash's "no more than two in a
# paragraph" can never fire on anything House.EmDash has not already caught.
# One rule, not two.
Slop.EmDash = NO

# Strict mode for posts drawn from client work, keyed on `client: true` in
# front matter, which Vale cannot read. `mise run client-numbers` turns both
# on for those posts, and the section at the end for their fixtures.
House.ClientNumbers = NO
House.ClientPractice = NO

# The STE style ships with the Microsoft package. It stays off: it reports 156
# alerts on the current posts, and 57 of them are contractions, which the
# voice of this blog uses on purpose.

# Hugo shortcodes are not prose. From the Hugo package's config fragment.
#
# Exclude `{{< ... >}}`, `{{% ... %}}`, [Who]({{< ... >}})
TokenIgnores = ({{[%<] .* [%>]}}.*?{{[%<] ?/.* [%>]}}), \
(\[.+\]\({{< .+ >}}\)), \
(?m)(?:^|[^\S\r\n])({{[%<] [\w/-]+(?: .+?)? [%>]}})(?=\s), \
[^\S\r\n]({{[%<](?:/\*) .* (?:\*/)[%>]}})\s

# Exclude `{{<  myshortcode `This is some <b>HTML</b>, ... >}}`
BlockIgnores = (?sm)^({{[%<] [\w/-]+\s(?:[^{]*?\s)?[%>]}})\n$, \
(?s) *({{< highlight [^>]* ?>}}.*?{{< ?/ ?highlight >}}), \
(?m)^(> FIXME [^\n]*)$

# The last one: a question for Glenn, a `> FIXME` line in a red callout, is a
# note, not prose (`words` skips it too). `fixme` keeps it from merging.

[test/vale/client/*.md]
House.ClientNumbers = YES
House.ClientPractice = YES
