name: github pages

on:
  push:
    branches:
      - master # Set a branch to deploy
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # Checkout runs `git init`, and git now hints that its default branch
      # name will change. Naming the branch this repository uses settles it.
      - name: Set the default branch name
        run: git config --global init.defaultBranch master

      - uses: actions/checkout@v7
        with:
          submodules: true # Fetch Hugo themes (true OR recursive)
          fetch-depth: 0 # Fetch all history for .GitInfo and .Lastmod

      # The dates check measures the branch against master. A pull request
      # checks out its merge commit and leaves master only as origin/master,
      # so name it here; a push to master already has it.
      - name: Name master for the branch checks
        if: ${{ github.event_name == 'pull_request' }}
        run: git branch master origin/master

      # Every tool the checks need is pinned in .tool-versions, so the runner
      # runs the versions this machine does. Adding a tool there is the whole
      # of adding it to CI. It replaces a hand-rolled Vale download and a Hugo
      # action whose version was a second copy of the pinned one.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@v4

      # The security rule names the author's own machines, so it is
      # gitignored and has to arrive as a secret. With no secret set the file
      # never appears, `mise run lint` fails on the missing rule, and that is the
      # point: a runner without the rule must not be able to publish.
      - name: Install the security rule
        env:
          INFRA_RULE: ${{ secrets.VALE_SECURITY_INFRA }}
        run: |
          set -euo pipefail
          if [ -z "${INFRA_RULE:-}" ]; then
            echo "the VALE_SECURITY_INFRA secret is not set on this repository"
            exit 1
          fi
          printf '%s\n' "$INFRA_RULE" > styles/Security/Infra.yml

      # The same task `.githooks/pre-commit` runs: prose, markdown, front
      # matter, heading order, anchors, date-only commits, formatting, the
      # production build, and htmltest over what it produced. The build this
      # checks is the one the deploy step publishes.
      - name: Check
        run: mise run check

      # Pages serves this artifact rather than a gh-pages branch, so the
      # custom domain lives in the repository's Pages settings.
      - name: Upload the site
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build

  deploy:
    if: ${{ github.ref == 'refs/heads/master' }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
