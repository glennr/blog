# The home page's "How I work": how I approach a system, as an engineer.
[[principles]]
  title = "Start from the problem"
  text = "I find out what's actually broken, and why, before anything gets built. Then we fix the cause, not the symptom."

[[principles]]
  title = "Built to run, not to demo"
  text = "Multi-tenant, observable and cheap to run, with the tests and security in from the start. Systems I've built hold up with enterprise customers on them."

[[principles]]
