# The consulting copy shared by the home page (layouts/partials/home/custom.html)
# and About (the `work` shortcode). Text is Markdown. A principle's `posts` are
# content paths; each becomes an inline link to that post, by its title.

# The user part of the address the home page asks readers to email, at the
# site's own domain. The page never prints the whole address.
emailUser = "hello"

[[principles]]
  title = "Ship small, and often"
  text = "A change that reaches production the same day is cheap to get wrong. At the SaaS we shipped about 50 times a month, under SOC 2 change controls, because the tests and the pipeline earned that trust. I still check that they do."
  posts = ["posts/fast-tests-and-mutation-testing-in-elixir"]

[[principles]]
  title = "Run what you build"
  text = "I've owned the incident response, the pentests and the disaster recovery, so I ask the production questions early: how you'll watch it, what it costs and where it breaks."
  posts = ["posts/monitor-elixir-app-in-k8s-with-promex", "posts/let-your-finance-team-track-aws-spend"]

[[principles]]
  title = "Let the build enforce it"
  text = "A convention holds until the first deadline. Where the design matters, I'd rather the compiler or CI say no than a reviewer remember to."
  posts = ["posts/enforce-phoenix-contexts-with-boundary", "posts/make-the-phoenix-scope-the-first-argument"]

[[principles]]
  title = "Agents in the loop"
  text = "I ship with coding agents every day, and I build products that agents can work with. The judgment stays with you and your team."
  posts = ["posts/mcp-before-rest-when-the-caller-is-an-agent", "posts/let-claude-code-design-in-the-running-app"]

