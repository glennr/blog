  text = "Clear boundaries, plain code and written decisions, so the system stays easy to change long after the first release."


# Projects' cards (`{{< work projects >}}`). The figure leads the outcome;
# `post` adds a link to the write-up.
[[projects]]
  title = "Bramble platform"
  problem = "Back-office teams at banks and insurers couldn't see where capacity was lost."
  built = "A multi-tenant analytics SaaS with schema-per-tenant Postgres, a LiveView UI and a reporting warehouse."
  figure = "0 to 1"
  outcome = "from an empty repo to a platform live with enterprise customers in the US and Australia, at 99.9% availability or better."
  stack = ["Elixir", "Phoenix", "PostgreSQL", "AWS"]

[[projects]]
  title = "Regional EKS migration"
  problem = "One AWS account per customer was costly and slow to change."
  built = "Regional EKS clusters managed in Pulumi, with staged releases."
  figure = "60%"
  outcome = "fewer cloud resources, and deploys down from about 45 minutes to 10."
  stack = ["Kubernetes", "Pulumi", "Docker"]

[[projects]]
  title = "Enterprise integrations"
  problem = "Banks needed secure data exchange and SSO before they'd go live."
  built = "Encrypted SFTP, S3 and SQS pipelines, SSO and API access."
  figure = "SOC 2"
  outcome = "Type 2 controls, with the enterprise go-lives unblocked."
  stack = ["AWS S3", "SQS", "SSO"]

[[projects]]
  title = "Typst PDF rendering"
  problem = "Report PDFs through headless Chrome were slow and fragile."
  built = "In-BEAM rendering with the Typst NIF, benchmarked against the CLI."
  figure = "5x"
  outcome = "faster than the Typst CLI: a 10-page report in 10 ms."
  stack = ["Elixir", "Typst", "NIF"]
  post = "posts/render-pdfs-in-elixir-with-the-typst-nif"

