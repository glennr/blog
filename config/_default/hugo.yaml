# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

baseURL: "https://glenn-roberts.com"
defaultContentLanguage: en

enableRobotsTXT: true
enableEmoji: true
summaryLength: 0

# The TIL list and the post list both fit on one page at this size, so no
# section ever paginates.
pagination:
  pagerSize: 100

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"
  til: "/til/:slugorfilename/"

taxonomies:
  tag: tags
  category: categories

outputs:
  home:
    - HTML
    - RSS
    - JSON

imaging:
  anchor: Center

sitemap:
  changefreq: daily
  filename: sitemap.xml
  priority: 0.5

# https://github.com/gohugoio/hugo/issues/9811
security:
  exec:
    osEnv:
      - "(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$"
      - ^ASDF_DIR$
      - ^HOME$
