# -- Site Configuration --
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/getting-started/

baseURL: "https://glenn-roberts.com"
defaultContentLanguage: en

enableRobotsTXT: true
enableEmoji: true
# Tag pages and the tag filter show a tag as written, "claude-code" and not
# "Claude-Code".
capitalizeListTitles: false
summaryLength: 0

# The post list, TIL notes included, fits on one page at this size, so it never
# paginates.
pagination:
  pagerSize: 100

permalinks:
  posts: "/posts/:year/:month/:day/:slug/"

taxonomies:
  tag: tags
  category: categories

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms
    - llmsfull

# /llms.txt, from layouts/home.llms.txt: a plain summary of the site for
# language models (https://llmstxt.org). /llms-full.txt, from
# layouts/home.llmsfull.txt, is every page's full text.
outputFormats:
  llms:
    mediaType: text/plain
    baseName: llms
    isPlainText: true
    notAlternative: true
  llmsfull:
    mediaType: text/plain
    baseName: llms-full
    isPlainText: true
    notAlternative: true

imaging:
  anchor: Center

sitemap:
  changefreq: daily
  filename: sitemap.xml
  priority: 0.5

# https://github.com/gohugoio/hugo/issues/9811
security:
  exec:
    osEnv:
      - "(?i)^(PATH|PATHEXT|APPDATA|TMP|TEMP|TERM)$"
      - ^ASDF_DIR$
      - ^HOME$
