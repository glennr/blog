# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "riso"
defaultAppearance = "light" # valid options: light or dark
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["posts"]

[seo]
  # Keep the hand-written description first, then fall back to the summary.
  metaDescriptionOrder = ["description", "summary", "site"]

[header]
  layout = "basic" # valid options: basic, fixed, fixed-fill, fixed-gradient, fixed-fill-blur, floating

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  # The home page is layouts/partials/home/custom.html. It draws its own
  # recent-posts and recent-TIL lists, so showRecent stays off.
  layout = "custom"
  showRecent = false

[article]
  # A page bundle's feature.webp shows above the title. "big" keeps the image
  # whole and the title on the page background, where "background" lays the
  # title over a blurred copy of it, which an illustration does not survive.
  showHero = true
  heroStyle = "big"
  showComments = false
  showDate = true
  showDateUpdated = false
  showAuthor = true
  # The author card goes under the article, so the first screen is the
  # title and the TL;DR, not a bio the reader has already seen.
  showAuthorBottom = true
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = true
  editURL = "https://github.com/glennr/blog/edit/master/content/"
  editAppendPath = true
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  # The margins hold asides (layouts/shortcodes/aside.html), not contents.
  showTableOfContents = false
  showTaxonomies = false
  showWordCount = false

[list]
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  groupByYear = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = true

[verification]
